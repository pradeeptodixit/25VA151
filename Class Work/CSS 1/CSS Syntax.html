<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Homepage</title>

    <style>
      body {
        background-color: antiquewhite;
        font-family: "Lato", sans-serif;
      }

      h1 {
        text-align: center;
      }

      #top h1 {
        font-size: 32px;
      }

      .container_wrapper {
        width: 80%;
        margin: auto;
        font-family: serif;
      }

      .main-image {
        text-align: center;
      }

      .main-image img {
        width: 100%;
        max-width: 600px;
        height: auto;
      }

      .text-block {
        margin-top: 10px;
        text-align: center;
      }

      .info {
        padding: 20px;
        background-color: #2196f3;
        color: white;
        opacity: 1;
        transition: opacity 0.6s;
        margin-bottom: 15px;
        text-align: center;
      }
    </style>
  </head>

  <body>
    <div class="container_wrapper">
      <div id="top">
        <h1>Welcome to My Homepage</h1>
      </div>

      <div id="main">
        <div class="main-image">
          <img src="img_nature_wide.jpg" alt="Nature" />
          <div class="text-block">
            <p>What a beautiful day</p>
          </div>
        </div>

        <div class="info">
          This is a demonstration of how CSS can change your HTML page.
        </div>
      </div>
    </div>
  </body>
</html>
